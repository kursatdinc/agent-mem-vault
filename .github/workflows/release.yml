name: release

on:
  push:
    tags: ["v*"]
  # Re-run the PyPI publish for an existing tag: gh workflow run release.yml --ref vX.Y.Z
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Check that a stable tag matches the package version
        if: ${{ !contains(github.ref_name, '-') }}
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found = 1; next} /^## \[/ || /^\[[^]]+\]: / {found = 0} found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

  publish-pypi:
    # Stable tags only (vX.Y.Z): a pre-release tag such as v1.1.0-rc.1 publishes to GitHub only.
    if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-mem-vault
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
