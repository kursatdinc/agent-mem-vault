name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please use a private advisory (see SECURITY.md) instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got. Include the tool call or command if you can.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem. A note's frontmatter helps if a record is involved (remove anything private).
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `agent-mem-vault doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-mem-vault --version`
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Codex
        - Other
        - Command line only
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Python version
      placeholder: macOS 15, Python 3.12
    validations:
      required: true
