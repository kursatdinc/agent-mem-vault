[project]
name = "agent-vault-memory"
version = "0.1.0"
description = "MCP server giving coding agents durable shared memory stored in an Obsidian vault."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "PyYAML",
    "PyStemmer",
]

[project.scripts]
agent-vault-memory = "agent_vault_memory.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_vault_memory"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
