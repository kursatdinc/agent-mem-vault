[project]
name = "agent-mem-vault"
version = "1.0.0"
description = "MCP server that gives coding agents durable, shared memory stored as notes in an Obsidian vault."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kürşat Dinç" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "obsidian",
    "agent-memory",
    "ai-agents",
    "claude-code",
    "codex",
    "llm",
    "knowledge-management",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3,<3",
    "PyYAML",
    "PyStemmer",
]

[project.urls]
Homepage = "https://github.com/kursatdinc/agent-mem-vault"
Documentation = "https://github.com/kursatdinc/agent-mem-vault/wiki"
Issues = "https://github.com/kursatdinc/agent-mem-vault/issues"
Changelog = "https://github.com/kursatdinc/agent-mem-vault/blob/main/CHANGELOG.md"

[project.scripts]
agent-mem-vault = "agent_mem_vault.cli:run"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/scripts",
    "/docs",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mem_vault"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
